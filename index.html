<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>App Store 国家/地区跳转链接</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --text-muted: #86868b;
    --border: #e5e5ea;
    --primary: #0071e3;
    --primary-active: #0062c3;
    --chip-bg: #e8e8ed;
    --wechat-green: #1AAD19;
    --success: #34c759;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --text-muted: #86868b;
      --border: #38383a;
      --chip-bg: #2c2c2e;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px 16px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.5; background: var(--bg); color: var(--text);
    transition: background 0.3s, color 0.3s;
  }
  h1 { font-size: 22px; margin: 0 0 8px; font-weight: 700; letter-spacing: -0.5px; }
  .hint { margin: 0 0 16px; font-size: 13px; color: var(--text-muted); }

  /* 顶部吸顶搜索区 */
  .sticky {
    position: sticky; top: 0; z-index: 20;
    margin: 0 -16px; padding: 12px 16px;
    background: rgba(245,245,247,.85);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
    transition: box-shadow .2s;
  }
  .sticky.shadow {
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    .sticky { background: rgba(0,0,0,.85); }
  }
  .searchRow { display: flex; gap: 8px; }
  input[type="search"] {
    flex: 1; min-width: 0; padding: 10px 14px;
    border: 1px solid var(--border); border-radius: 10px;
    font-size: 15px; background: var(--card); color: var(--text);
    -webkit-appearance: none; transition: border-color 0.2s;
  }
  input[type="search"]:focus { outline: none; border-color: var(--primary); }
  
  button {
    padding: 0 14px; border: 0; border-radius: 10px;
    background: var(--primary); color: #fff; font-size: 14px; font-weight: 500;
    cursor: pointer; white-space: nowrap; font-family: inherit;
    transition: background 0.2s, transform 0.1s ease;
  }
  button:active { transform: scale(0.96); background: var(--primary-active); }
  button.secondary { background: var(--chip-bg); color: var(--text); }
  button.secondary:active { background: var(--border); }
  button.success { background: var(--success); }

  /* 地区筛选 */
  .chips { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 6px 14px; border-radius: 999px; height: 32px;
    background: var(--chip-bg); color: var(--text); font-size: 13px;
    border: 1px solid transparent; font-weight: 500;
  }
  .chip.active { background: var(--primary); color: #fff; }

  /* 列表头部统计 */
  .count { margin: 16px 0 12px; font-size: 13px; color: var(--text-muted); font-weight: 500; }
  
  h2.groupTitle {
    font-size: 15px; margin: 24px 0 12px; color: var(--text);
    display: flex; align-items: center; gap: 8px; font-weight: 600;
  }
  h2.groupTitle span.n { font-size: 12px; color: var(--text-muted); font-weight: 400; background: var(--chip-bg); padding: 2px 8px; border-radius: 10px; }

  /* 卡片列表 */
  .list { display: grid; gap: 12px; }
  .item {
    display: flex; gap: 12px; align-items: center; justify-content: space-between;
    padding: 16px; background: var(--card); border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    border: 1px solid var(--border);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .item:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
  @media (prefers-color-scheme: dark) {
    .item { box-shadow: none; }
    .item:hover { box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
  }
  .info { min-width: 0; flex: 1; }
  .name { font-weight: 600; font-size: 16px; display: flex; align-items: baseline; gap: 6px; }
  .name em { font-style: normal; font-weight: 400; color: var(--text-muted); font-size: 13px; }
  .meta { margin-top: 4px; font-size: 12px; color: var(--text-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .meta span.tag { display: inline-block; background: var(--chip-bg); padding: 1px 6px; border-radius: 6px; margin: 0 2px; cursor: pointer; }

  /* 按钮组 */
  .actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .actions button { padding: 8px 10px; font-size: 12.5px; border-radius: 8px; display: flex; align-items: center; gap: 4px; }
  .actions button svg { width: 14px; height: 14px; fill: currentColor; }
  
  .empty { padding: 40px 20px; text-align: center; color: var(--text-muted); background: var(--card); border-radius: 14px; border: 1px dashed var(--border); }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
    background: rgba(20,20,20,.88); color: #fff;
    padding: 10px 18px; border-radius: 999px; font-size:14px;
    backdrop-filter: blur(10px); z-index:99;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show { opacity:1; }

  /* 微信关注横幅 */
  .wechat-banner {
    margin-top: 40px;
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(26, 173, 25, 0.2);
  }
  @media (prefers-color-scheme: dark) {
    .wechat-banner { box-shadow: 0 8px 24px rgba(26, 173, 25, 0.15); }
  }
  .wechat-banner img {
    width: 100%;
    height: auto;
    display: block;
  }

  @media (max-width: 480px) {
    .item { flex-direction: column; align-items: stretch; gap: 14px; }
    .actions { flex-direction: row; width: 100%; }
    .actions button { flex: 1; justify-content: center; padding: 10px 6px; }
  }
</style>
</head>

        </div>
        <div class="actions">
          <button class="btn-open">${iconOpen} 打开</button>
          <button class="btn-copy-itms secondary">${iconCopy} 唤起链接</button>
          <button class="btn-copy-https secondary">${iconLink} 网页链接</button>
        </div>
      `;

      // 唤起
      item.querySelector(".btn-open").onclick = () => {
        if (!isAppleDevice) {
          showToast("⚠️ 需要 iPhone / iPad Safari 才能唤起 App Store");
        } else {
          window.location.href = itmsLink;
        }
      };
      // 复制 itms
      item.querySelector(".btn-copy-itms").onclick = ()=>copyText(itmsLink, "✅ 已复制唤起链接");
      // 复制 https
      item.querySelector(".btn-copy-https").onclick = ()=>copyText(httpsLink, "✅ 已复制网页链接");
      // 点击标签复制 cc / dsf
      item.querySelectorAll(".meta .tag").forEach(tag=>{
        tag.onclick = ()=>copyText(tag.dataset.val, `✅ 已复制：${tag.dataset.val}`);
      })

      frag.appendChild(item);
    });
    list.appendChild(frag);
    contentEl.appendChild(list);
  });
}

document.getElementById("btnClear").onclick = () => {
  qEl.value = "";
  currentRegion = "all";
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.region === "all"));
  render();
  qEl.focus();
};
qEl.addEventListener("input", render);
// ESC 清空
document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape") {
    qEl.value = "";
    currentRegion = "all";
    document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.region === "all"));
    render();
    qEl.blur();
  }
})

render();
</script>
